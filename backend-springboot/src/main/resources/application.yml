server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartflash-backend

  # 1. PostgreSQL 16+ Native Local Connection
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartflash_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # 2. Spring Data JPA & Hibernate 6
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # 3. Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # 4. In-Memory Cache (Caffeine — Local Native, 0ms latency)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=30m

  # 5. Multipart File Upload (Avatars, Flashcard Images & OCR Scans)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  # 6. Mail Configuration (OTP & Password Reset)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@smartflash.local}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Swagger / OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# SmartFlash Custom Application Properties
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://10.0.2.2:8080}
  jwt:
    secret: ${JWT_SECRET:SmartFlashSuperSecretKeyForJwtSigning2026MustBeAtLeast256BitsLong!}
    access-token-expiration-ms: 86400000        # 24 hours
    refresh-token-expiration-ms: 604800000      # 7 days
  oauth2:
    google-client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/uploads}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    dkt-timeout-ms: 1500
    ocr-timeout-ms: 15000
    chat-timeout-ms: 20000

logging:
  level:
    root: INFO
    com.elearning: DEBUG
    org.springframework.security: INFO
